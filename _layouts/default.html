<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/nc.png' | relative_url }}">
</head>
<body{% if page.url == "/" %} class="home"{% endif %}>
  <header class="site-head">
    <a class="wordmark" href="{{ '/' | relative_url }}"><img class="avatar-sm" src="{{ '/assets/img/nc.png' | relative_url }}" alt="">NC</a>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-foot">
    <span>NC · poured by hand</span>
  </footer>
</body>
</html>
